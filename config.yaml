# --- Phase 2: scoring with Claude --------------------------------------------
scoring:
  model: claude-opus-5-5
  # How hard Claude thinks: low, medium, high. Higher = better but costs more.
  effort: low
  # Jobs scoring below this (0-100) are marked "skipped".
  min_fit_score: 65
  # Most jobs to score in one run, unless you pass --limit. Protects your credits.
  default_limit: 10

# --- Phase 3: tailoring + daily queue ----------------------------------------
tailoring:
  model: claude-opus-5-5
  effort: high           # how hard Claude works on the rewrite
  check_effort: medium   # how hard the truthfulness check works

daily:
  # How many tailored applications "prepare" gets ready for you each day.
  queue_size: 25
  # Tailored jobs with a fit score at or above this are approved automatically
  # (no review page); they go straight to "apply", where you still click Submit.
  # Lower scores still go to the review page. Delete this line to turn it off.
  auto_approve_min_fit: 75
  # Most jobs "prepare" will score in one run while looking for good matches.
  max_to_score: 40

# Where tailored resumes are saved (one folder per job).
output_dir: output/resumes
