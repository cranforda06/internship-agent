# Settings for the internship agent. Edit these freely.

# Where your files live (relative to the project folder).
resume_path: data/resume.md
tracker_path: data/applications.db

# The term you're applying for.
target_term: Summer 2027

# --- Phase 2: finding internships -------------------------------------------
search:
  # A job title must contain at least one of these (whole words, any case)...
  include_keywords:
    # Your core targets
    - business analyst
    - business analysis
    - business systems
    - systems analyst
    - systems analysis
    - information systems
    - information technology
    - IT
    - technology
    - business technology
    - business and technology
    - ERP
    - SAP
    - Oracle
    - Salesforce
    - CRM
    - implementation
    - solutions
    - digital
    - transformation
    - process improvement
    - process
    - product owner
    - project management
    - project manager
    - program management
    - PMO
    - technology consulting
    - consultant
    - consulting
    - IT audit
    - technology risk
    - governance
    - cybersecurity
    - deployment strategist
    # Also OK (scored a bit lower than the core targets)
    - data analyst
    - data analytics
    - business analytics
    - analytics
    - business intelligence
    - data
    - analyst
    - strategy
    - operations
    # Added 2026-11-14: close to BA/IS work, scored by Claude like the rest
    - product management
    - product manager
    - product
    - insights
    - analysis
    - applications
    - application development
    - information management
    - knowledge management
    - statistics
    - GIS

  # ...and none of these. These are roles that need a different background
  # (CS, engineering, PhD research, quant finance).
  exclude_keywords:
    - software engineer
    - software engineering
    - software developer
    - engineer
    - engineering
    - machine learning
    - ML
    - AI research
    - research
    - scientist
    - PhD
    - quant
    - quantitative
    - trading
    - trader
    - hardware
    - mechanical
    - electrical
    - firmware
    - embedded
    - designer
    - investment banking
    - MBA
    - master's
    - masters
    - graduate
    - data science
    - data scientist

  # Skip internships located only outside the US.
  us_only: true

  # Skip postings older than this many days (newer = fewer applicants and
  # less chance it's already filled). Jobs with no post date are kept.
  max_posting_age_days: 14

  # Every job is labeled: official hiring system (Workday, Greenhouse...),
  # the company's own site, or "unverified". true = drop unverified ones;
  # false = keep them but show a warning on the review page.
  only_verified_sites: false

  # You'll relocate, but these areas come first: they get a star, a score
  # bonus, and are scored before other jobs. Matched anywhere in the location.
  preferred_locations:
    # Richmond area
    - Richmond
    - Glen Allen
    - Henrico
    - Midlothian
    - Chesterfield
    - Mechanicsville
    - Short Pump
    # DC area
    - Washington, DC
    - Washington DC
    - Washington, D.C.
    - Arlington
    - Alexandria
    - McLean
    - Tysons
    - Reston
    - Herndon
    - Fairfax
    - Chantilly
    - Vienna
    - Falls Church
    - Ashburn
    - Sterling
    - Springfield, VA
    - Bethesda
    - Rockville
    - Silver Spring
    - Gaithersburg
    - Annapolis Junction
    - Fort Meade
  preferred_location_bonus: 10

