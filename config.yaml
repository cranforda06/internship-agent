# Settings for the internship agent. Edit these freely.

# Where your files live (relative to the project folder).
resume_path: data/resume.md
tracker_path: data/applications.db

# The term you're applying for.
target_term: Summer 2027

# --- Phase 2: finding internships -------------------------------------------
search:
  # A job title must contain at least one of these (whole words, any case)...
  include_keywords:
    # Your core targets
    - business analyst
    - business analysis
    - business systems
    - systems analyst
    - systems analysis
    - information systems
    - information technology
    - IT
    - technology
    - business technology
    - business and technology
    - ERP
    - SAP
    - Oracle
    - Salesforce
    - CRM
    - implementation
    - solutions
    - digital
    - transformation
    - process improvement
    - process
    - product owner
    - project management
    - project manager
    - program management
    - PMO
    - technology consulting
    - consultant
    - consulting
    - IT audit
    - technology risk
    - governance
    - cybersecurity
    - deployment strategist
    # Also OK (scored a bit lower than the core targets)
    - data analyst
    - data analytics
    - business analytics
    - analytics
    - business intelligence
    - data
    - analyst
    - strategy
    - operations

  # ...and none of these. These are roles that need a different background
  # (CS, engineering, PhD research, quant finance).
  exclude_keywords:
    - software engineer
    - software engineering
    - software developer
    - engineer
    - engineering
    - machine learning
    - ML
    - AI research
    - research
    - scientist
    - PhD
    - quant
    - quantitative
    - trading
    - trader
    - hardware
    - mechanical
    - electrical
    - firmware
    - embedded
    - designer
    - investment banking
    - MBA
    - master's
    - masters
    - graduate
    - data science
    - data scientist

  # Skip internships located only outside the US.
  us_only: true

  # You'll relocate, but these areas come first: they get a star, a score
  # bonus, and are scored before other jobs. Matched anywhere in the location.
  preferred_locations:
    # Richmond area
    - Richmond
    - Glen Allen
    - Henrico
    - Midlothian
    - Chesterfield
    - Mechanicsville
    - Short Pump
    # DC area
    - Washington, DC
    - Washington DC
    - Washington, D.C.
    - Arlington
    - Alexandria
    - McLean
    - Tysons
    - Reston
    - Herndon
    - Fairfax
    - Chantilly
    - Vienna
    - Falls Church
    - Ashburn
    - Sterling
    - Springfield, VA
    - Bethesda
    - Rockville
    - Silver Spring
    - Gaithersburg
    - Annapolis Junction
    - Fort Meade
  preferred_location_bonus: 10

# Company job boards to check directly, besides the SimplifyJobs list.
# The name is the part after greenhouse.io/ or jobs.lever.co/ in a job link.
greenhouse_boards:
  - appian        # McLean, VA
  - stripe
  - robinhood
  - coinbase
  - datadog
  - cloudflare
  - affirm
  - lyft
  - pinterest
  - databricks
  - figma
  - carvana
  - samsara
  - sigmacomputing
lever_boards:
  - palantir      # big DC/Virginia presence
  - zoox
  - shieldai

# --- Phase 2: scoring with Claude --------------------------------------------
scoring:
  model: claude-opus-5-5
  # How hard Claude thinks: low, medium, high. Higher = better but costs more.
  effort: low
  # Jobs scoring below this (0-100) are marked "skipped".
  min_fit_score: 65
  # Most jobs to score in one run, unless you pass --limit. Protects your credits.
  default_limit: 10

# --- Phase 3: tailoring + daily queue ----------------------------------------
tailoring:
  model: claude-opus-5-5
  effort: medium         # how hard Claude works on the rewrite
  check_effort: medium   # how hard the truthfulness check works

daily:
  # How many tailored applications "prepare" gets ready for you each day.
  queue_size: 5
  # Most jobs "prepare" will score in one run while looking for good matches.
  max_to_score: 40

# Where tailored resumes are saved (one folder per job).
output_dir: output/resumes
